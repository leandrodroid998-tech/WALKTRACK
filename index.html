<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WALKTRACK</title><meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--o:#FF6A00;--b:#101010;--c:#1C1C1C;--c2:#2a2a2a;--m:#9a9a9a}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--b);color:#fff;font:15px/1.4 Roboto,'Segoe UI',system-ui,sans-serif;overflow:hidden}
.v{display:none;position:absolute;inset:0 0 calc(68px + env(safe-area-inset-bottom));overflow:auto;padding:calc(16px + env(safe-area-inset-top)) 16px 24px}
.v.on{display:block;animation:in .3s}.v.map{padding:0;overflow:hidden}.v.map.on{display:flex;flex-direction:column}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1,.big{font-weight:800;font-style:italic;letter-spacing:-.02em}h1{font-size:26px}
h2{font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.12em;margin:22px 0 10px}
.mut{color:var(--m);font-size:13px}.o{color:var(--o)}
.card{background:var(--c);border-radius:20px;padding:16px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.kpi b{display:block;font-size:24px;font-weight:800;font-style:italic}.kpi span{color:var(--m);font-size:12px}
.btn{border:0;border-radius:16px;padding:15px 18px;font:800 15px Roboto,sans-serif;font-style:italic;background:var(--o);color:#fff;width:100%;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 6px 24px #ff6a0044;transition:.15s}
.btn.g{background:var(--c2);box-shadow:none}.btn:active{transform:scale(.97)}.btn.s{padding:10px 14px;width:auto;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--c2);background:var(--c);color:#ddd;border-radius:20px;padding:8px 14px;font:600 13px Roboto,sans-serif}.chip.on{background:var(--o);border-color:var(--o);color:#fff}
.bar{height:12px;background:var(--c2);border-radius:8px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9a40,var(--o));border-radius:8px;transition:width 1s}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--c);display:flex;border-top:1px solid var(--c2);z-index:1100}
nav button{flex:1;background:0;border:0;color:var(--m);font:700 10px Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--o)}nav .mid.on{color:#fff}.mid .c{width:58px;height:58px;border-radius:50%;background:var(--o);display:grid;place-items:center;margin-top:-28px;color:#fff;box-shadow:0 0 26px #ff6a00aa;border:4px solid var(--b)}.mid.rec .c{animation:pu 1.4s infinite}
@keyframes pu{50%{box-shadow:0 0 40px #ff6a00}}
.row{padding:12px;border-radius:14px;background:var(--c);margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row b{display:block}input,select{width:100%;background:var(--c2);border:0;border-radius:14px;padding:13px;color:#fff;font:15px Roboto,sans-serif;outline:0}
.pn{flex:1;overflow:auto;padding:14px 16px 24px;background:var(--b)}#mapP{flex:0 0 38%}#mapL{position:absolute;inset:0}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
#wp{position:absolute;left:10px;right:10px;bottom:10px;z-index:500;background:#101010f2;border-radius:24px;padding:16px;backdrop-filter:blur(8px)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.g3 b{display:block;font-size:22px;font-weight:800;font-style:italic}.g3 span{font-size:11px;color:var(--m)}
.hero{font-size:54px!important;grid-column:1/4}.ctrl{display:flex;gap:10px}.warn{background:#5a2a00;border-radius:10px;padding:8px;margin-bottom:8px;font-size:13px}
.av{width:46px;height:46px;border-radius:50%;background:var(--o) center/cover;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}.hd>div:nth-child(2){flex:1}
.demo{background:#3a2000;border:1px dashed var(--o);border-radius:14px;padding:10px 12px;font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wi{display:flex;justify-content:space-between;align-items:center;gap:8px}.wi .mini{width:90px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal i{font-style:normal;color:var(--m);font-size:11px}.cal u{text-decoration:none;padding:7px 0;border-radius:10px;font-size:13px;background:var(--c2)}.cal u.a{background:var(--o);font-weight:800}.cal u.t{outline:2px solid #fff}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center;font-size:11px}
.md{width:64px;height:64px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font:800 italic 20px Roboto;background:var(--c2);color:#555}
.md.u{background:radial-gradient(circle at 30% 25%,#ffc08a,var(--o) 55%,#b34700);color:#fff;box-shadow:0 0 18px #ff6a0088;animation:pop .7s;position:relative;overflow:hidden}
.md.u:after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,#fff6 50%,transparent 60%);animation:sh 3s infinite}
@keyframes pop{0%{transform:scale(.3) rotate(-90deg)}70%{transform:scale(1.15)}}@keyframes sh{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.ov{position:fixed;inset:0;background:var(--b);z-index:2000;overflow:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 24px;display:none}.ov.on{display:block;animation:in .3s}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-150%);background:var(--o);color:#fff;padding:12px 18px;border-radius:16px;font-weight:700;z-index:3000;transition:.35s;max-width:90%;text-align:center}#toast.on{transform:translate(-50%,0)}
#splash{position:fixed;inset:0;background:#000;z-index:4000;display:grid;place-items:center;transition:opacity .6s}#splash img{width:70%;max-width:320px;animation:pop 1s}
.sk{color:var(--m);padding:10px;text-align:center}.nomap{background:#141414;border-radius:14px;display:grid;place-items:center;color:var(--m);font-size:12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.sw input{width:22px;height:22px;accent-color:var(--o)}.gi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0}.gi input{width:90px;text-align:center}
.logo{font:800 italic 22px Roboto;letter-spacing:-.03em}
canvas{max-width:100%}
</style></head><body>

function streaks(a){const ds=[...new Set(a.map(w=>dn(w.start)))].sort((x,y)=>x-y);let best=0,run=0,p=null;ds.forEach(d=>{run=p!==null&&d==p+1?run+1:1;best=Math.max(best,run);p=d});const t=dn(Date.now());return{cur:ds.length&&(ds.at(-1)==t||ds.at(-1)==t-1)?run:0,best}}
const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,q=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742*Math.asin(Math.sqrt(q))};

function chart(id,type,labels,data,label){CH[id]?.destroy();const c=document.getElementById(id);if(!c)return;CH[id]=new Chart(c,{type,data:{labels,datasets:[{label,data,backgroundColor:type=='line'?'#ff6a0033':'#FF6A00',borderColor:'#FF6A00',borderRadius:8,tension:.4,fill:type=='line',pointRadius:3,pointBackgroundColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}},animation:{duration:900}}})}
const dl_=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
function buckets(r){const n=Date.now(),B=[];if(r<=30)for(let i=r-1;i>=0;i--){const f=sod(n-i*864e5);B.push([f,f+864e5,dl_(f)])}else if(r==90)for(let i=12;i>=0;i--){const f=sow(n)-i*7*864e5;B.push([f,f+7*864e5,dl_(f)])}else for(let i=11;i>=0;i--){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()-i);const e=new Date(d);e.setMonth(e.getMonth()+1);B.push([+d,+e,d.toLocaleDateString('pt-BR',{month:'short'})])}return B}
const M={dist:['Distância (km)',a=>sum(a,w=>w.dist)],time:['Tempo (min)',a=>sum(a,w=>w.dur)/60],speed:['Velocidade (km/h)',a=>spd(sum(a,w=>w.dist),sum(a,w=>w.dur))],freq:['Caminhadas',a=>a.length]};
const series=(a,r,m)=>{const B=buckets(r);return[B.map(b=>b[2]),B.map(b=>+f1(M[m][1](inR(a,b[0],b[1])),2))]};

const ST={r:30,m:'dist',t:'p',fp:0,fd:0};
const sr=v=>{ST.r=+v;stats()},sm=v=>{ST.m=v;stats()},stab=v=>{ST.t=v;stats()},sfp=v=>{ST.fp=+v;stats()},sfd=v=>{ST.fd=+v;stats()};
const wi=w=>`<div class="card wi" onclick="det('${w.id}')"><div><b>${new Date(w.start).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'})} · ${new Date(w.start).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</b><br><span class="mut">${f1(w.dist,2)} km · ${T(w.dur)} · ${f1(spd(w.dist,w.dur))} km/h · ${Math.round(w.kcal)} kcal</span></div><div class="mini">${svg(w.pts,56)}</div></div>`;
function recs(a){const b=(f,l,u)=>{const w=a.reduce((x,y)=>f(y)>f(x)?y:x,a[0]);return`<div class="row"><div><b>${l}</b><span class="mut">${dm(w.start)}</span></div><b class="o">${u(w)}</b></div>`};return b(w=>w.dist,'Maior distância',w=>f1(w.dist,2)+' km')+b(w=>w.dur,'Maior duração',w=>T(w.dur))+b(w=>w.dist>.5?spd(w.dist,w.dur):0,'Maior velocidade média',w=>f1(spd(w.dist,w.dur))+' km/h')}
function cal(a){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),fi=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),ac={};a.forEach(w=>{const x=new Date(w.start);if(x.getFullYear()==y&&x.getMonth()==m)ac[x.getDate()]=1});let h='<div class="cal">'+'DSTQQSS'.split('').map(x=>`<i>${x}</i>`).join('');for(let i=0;i<fi;i++)h+='<u style="background:0"></u>';for(let i=1;i<=n;i++)h+=`<u class="${ac[i]?'a':''} ${i==d.getDate()?'t':''}">${i}</u>`;return h+'</div>'}
function stats(){const a=W(),n=Date.now();let h=demoBar()+'<h1>ESTATÍSTICAS</h1>'+chips([['p','Desempenho'],['h','Histórico']],ST.t,'stab');if(!a.length){$('#v-stats').innerHTML=h+empty();return}
if(ST.t=='h'){const f=a.filter(w=>(!ST.fp||w.start>=n-ST.fp*864e5)&&w.dist>=ST.fd);$('#v-stats').innerHTML=h+chips([[0,'Todo período'],[7,'7 dias'],[30,'30 dias'],[90,'90 dias']],ST.fp,'sfp')+chips([[0,'Qualquer distância'],[2,'+2 km'],[5,'+5 km'],[10,'+10 km']],ST.fd,'sfd')+(f.length?f.map(wi).join(''):'<div class="sk">Nenhuma caminhada com esses filtros</div>');return}
const ra=inR(a,n-ST.r*864e5),d=sum(ra,w=>w.dist),t=sum(ra,w=>w.dur),s=streaks(a),cm=inR(a,som(n)),pm=new Date();pm.setMonth(pm.getMonth()-1);pm.setDate(1);pm.setHours(0,0,0,0);const pv=inR(a,+pm,som(n)),df=(c,p)=>p?`${c>=p?'+':''}${Math.round((c-p)/p*100)}%`:'—';
$('#v-stats').innerHTML=h+chips([[7,'7 dias'],[30,'30 dias'],[90,'90 dias'],[365,'12 meses']],ST.r,'sr')+`<div class="grid"><div class="card kpi"><b>${f1(d)} km</b><span>Distância total</span></div><div class="card kpi"><b>${T(t)}</b><span>Tempo total</span></div><div class="card kpi"><b>${ra.length}</b><span>Caminhadas</span></div><div class="card kpi"><b>${f1(ra.length?d/ra.length:0,2)} km</b><span>Média por caminhada</span></div><div class="card kpi"><b>${f1(spd(d,t))} km/h</b><span>Velocidade média</span></div><div class="card kpi"><b>${pace(d,t)}</b><span>Ritmo médio /km</span></div><div class="card kpi"><b>${Math.round(d*.57*S.cfg.kg)}</b><span>Calorias (est.)</span></div><div class="card kpi"><b>${f1(Math.max(0,...ra.map(w=>w.dist)),2)} km</b><span>Recorde no período</span></div></div><h2>Gráfico</h2>${chips([['dist','Distância'],['time','Tempo'],['speed','Velocidade'],['freq','Frequência']],ST.m,'sm')}<div class="card" style="height:240px"><canvas id="cs"></canvas></div><h2>Mês atual vs anterior</h2><div class="card"><div class="sw"><span>Distância</span><b>${f1(sum(cm,w=>w.dist))} km <span class="o">${df(sum(cm,w=>w.dist),sum(pv,w=>w.dist))}</span></b></div><div class="sw"><span>Caminhadas</span><b>${cm.length} <span class="o">${df(cm.length,pv.length)}</span></b></div><div class="sw"><span>Tempo</span><b>${T(sum(cm,w=>w.dur))} <span class="o">${df(sum(cm,w=>w.dur),sum(pv,w=>w.dur))}</span></b></div></div><h2>Calendário · sequência ${s.cur} dia(s) (melhor: ${s.best})</h2><div class="card">${cal(a)}</div><h2>Histórico de recordes</h2>${recs(a)}`;
const [l,v]=series(a,ST.r,ST.m);chart('cs',ST.m=='speed'?'line':'bar',l,v,M[ST.m][0])}
// ---------- perfil
function prof(){const a=W(),AC=achs(),g=S.goals,own=S.walks;$('#v-prof').innerHTML=`<div style="text-align:center"><label style="display:inline-block"><div class="av" style="width:96px;height:96px;font-size:40px;margin:auto;${S.avatar?`background-image:url(${S.avatar})`:''}">${S.avatar?'':esc((S.name||'W')[0].toUpperCase())}</div><input type="file" accept="image/*" hidden onchange="setAv(this)"><div class="mut" style="margin:6px">Toque para trocar a foto</div></label></div><input placeholder="Seu nome" value="${esc(S.name)}" onchange="S.name=this.value.trim();save();toast('Nome salvo')"><div class="mut" style="text-align:center;margin:8px">No WALKTRACK desde ${dm(S.since)}</div>
<div class="grid"><div class="card kpi"><b>${f1(sum(own,w=>w.dist))} km</b><span>Total percorrido</span></div><div class="card kpi"><b>${own.length}</b><span>Caminhadas</span></div></div>
<h2>Conquistas (${AC.filter(x=>S.ach[x[0]]).length}/${AC.length})</h2><div class="card"><div class="ach">${AC.map(([id,t,g])=>`<div><div class="md ${S.ach[id]?'u':''}">${g}</div>${t}</div>`).join('')}</div></div>
<h2>Metas pessoais</h2><div class="card">${[['day','Distância diária (km)'],['week','Distância semanal (km)'],['month','Distância mensal (km)'],['count','Caminhadas no mês']].map(([k,t])=>`<div class="gi"><span>${t}</span><input type="number" min="1" value="${g[k]}" onchange="S.goals['${k}']=Math.max(1,+this.value||1);save();toast('Meta atualizada')"></div>`).join('')}</div>
<h2>Recordes pessoais</h2>${own.length?recs(own):'<div class="sk">Seus recordes aparecem após a primeira caminhada</div>'}
<h2>Privacidade e preferências</h2><div class="card">${[['share','Permitir compartilhar localização na caminhada'],['notif','Notificações de metas e conquistas'],['wake','Manter tela ligada ao caminhar']].map(([k,t])=>`<div class="sw"><span>${t}</span><input type="checkbox" ${S.cfg[k]?'checked':''} onchange="S.cfg['${k}']=this.checked;save()"></div>`).join('')}<div class="gi"><span>Peso (kg) para calorias</span><input type="number" min="30" max="250" value="${S.cfg.kg}" onchange="S.cfg.kg=Math.min(250,Math.max(30,+this.value||70));save()"></div></div>
<div id="inst"></div><button class="btn g" style="margin-top:10px;color:#ff6b6b" onclick="if(confirm('Apagar TODOS os dados do app?')){localStorage.removeItem(K);location.reload()}">Apagar meus dados</button><p class="mut" style="text-align:center;margin:14px">Mapas © OpenStreetMap · WALKTRACK</p>`;if(dip)$('#inst').innerHTML='<button class="btn" onclick="dip.prompt()">Instalar aplicativo</button>'}
function setAv(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);S.avatar=c.toDataURL('image/jpeg',.8);save();prof()};im.src=r.result};r.readAsDataURL(f)}
let dip;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(cur=='prof')prof()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go('home');setTimeout(()=>{$('#splash').style.opacity=0;setTimeout(()=>$('#splash').remove(),600)},1100);
</script></body></html>
